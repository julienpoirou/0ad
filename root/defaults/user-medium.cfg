; Language
locale = "fr"

; Rendering engine
rendererbackend = "gl"
vsync = false

; Sharpness
textures.quality = 1          ; 0 low, 1 medium, 2 high
textures.maxanisotropy = 4    ; 1 = anisotropic filtering disabled
antialiasing = "msaa4"        ; disabled, fxaa, msaa2/4/8/16

; Effects
shadows = false
shadowpcf = false
watereffects = false
waterfancyeffects = false
waterrealdepth = false
waterrefraction = false
waterreflection = false
particles = false
silhouettes = false
postproc = false

; Window
windowed = true
